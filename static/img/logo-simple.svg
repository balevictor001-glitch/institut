<svg width="140" height="60" viewBox="0 0 140 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient principal -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6610f2;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient secondaire -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#198754;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f5132;stop-opacity:1" />
    </linearGradient>

    <!-- Ombre -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect x="0" y="0" width="140" height="60" rx="10" ry="10"
        fill="white" stroke="#dee2e6" stroke-width="1"/>

  <!-- Icône : diplôme + étudiant -->
  <g transform="translate(8,10)">

    <!-- Chapeau académique -->
    <polygon points="15,5 30,12 15,19 0,12"
             fill="url(#mainGradient)"
             filter="url(#shadow)"/>

    <!-- Base du chapeau -->
    <rect x="8" y="18" width="14" height="4" rx="1"
          fill="url(#mainGradient)"/>

    <!-- Gland -->
    <line x1="30" y1="12" x2="34" y2="22"
          stroke="url(#accentGradient)"
          stroke-width="2"/>
    <circle cx="34" cy="24" r="2"
            fill="url(#accentGradient)"/>

    <!-- Petit livre -->
    <rect x="5" y="28" width="20" height="10" rx="2"
          fill="url(#accentGradient)"
          filter="url(#shadow)"/>
    <line x1="15" y1="28" x2="15" y2="38"
          stroke="white" stroke-width="1"/>
  </g>

  <!-- Texte principal -->
  <text x="48" y="24"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="url(#mainGradient)"
        filter="url(#shadow)">
        INSTITUT
  </text>

  <!-- Sous-titre -->
  <text x="48" y="42"
        font-family="Arial, sans-serif"
        font-size="8"
        fill="#6c757d">
        Gestion des Étudiants
  </text>

  <!-- Décoration -->
  <circle cx="125" cy="15" r="3"
          fill="url(#accentGradient)" opacity="0.7"/>
  <circle cx="118" cy="25" r="2"
          fill="url(#mainGradient)" opacity="0.5"/>
  <circle cx="130" cy="35" r="2.5"
          fill="url(#accentGradient)" opacity="0.6"/>

</svg>