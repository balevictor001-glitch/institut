<svg width="120" height="60" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient pour le texte principal -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0056b3;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient pour l'accent -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#28a745;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e7e34;stop-opacity:1" />
    </linearGradient>

    <!-- Ombre portée -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fond arrondi -->
  <rect x="0" y="0" width="120" height="60" rx="8" ry="8" fill="white" stroke="#e9ecef" stroke-width="1"/>

  <!-- Icône panier stylisée -->
  <g transform="translate(8, 15)">
    <!-- Corps du panier -->
    <rect x="2" y="8" width="16" height="12" rx="2" fill="url(#accentGradient)" filter="url(#shadow)"/>

    <!-- Poignées du panier -->
    <path d="M 0 10 Q 2 6 4 10" stroke="url(#accentGradient)" stroke-width="2" fill="none"/>
    <path d="M 16 10 Q 18 6 20 10" stroke="url(#accentGradient)" stroke-width="2" fill="none"/>

    <!-- Lignes du panier -->
    <line x1="4" y1="10" x2="4" y2="18" stroke="white" stroke-width="1"/>
    <line x1="8" y1="10" x2="8" y2="18" stroke="white" stroke-width="1"/>
    <line x1="12" y1="10" x2="12" y2="18" stroke="white" stroke-width="1"/>
    <line x1="16" y1="10" x2="16" y2="18" stroke="white" stroke-width="1"/>

    <!-- Roues -->
    <circle cx="4" cy="22" r="2" fill="#6c757d"/>
    <circle cx="16" cy="22" r="2" fill="#6c757d"/>
  </g>

  <!-- Texte "Sale" -->
  <text x="35" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#textGradient)" filter="url(#shadow)">SALE</text>

  <!-- Tagline -->
  <text x="35" y="42" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">Gestion Produits</text>

  <!-- Élément décoratif -->
  <circle cx="105" cy="15" r="3" fill="url(#accentGradient)" opacity="0.7"/>
  <circle cx="100" cy="25" r="2" fill="url(#textGradient)" opacity="0.5"/>
  <circle cx="110" cy="35" r="2.5" fill="url(#accentGradient)" opacity="0.6"/>
</svg>