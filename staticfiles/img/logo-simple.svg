<svg width="80" height="40" viewBox="0 0 80 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient principal -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0056b3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004085;stop-opacity:1" />
    </linearGradient>

    <!-- Ombre -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Texte "SALE" stylisé -->
  <text x="40" y="25" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
        fill="url(#brandGradient)" text-anchor="middle" filter="url(#textShadow)">
    SALE
  </text>

  <!-- Ligne décorative -->
  <line x1="10" y1="32" x2="70" y2="32" stroke="url(#brandGradient)" stroke-width="2" opacity="0.7"/>
</svg>