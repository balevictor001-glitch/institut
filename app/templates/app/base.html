{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestion Institut{% endblock %}</title>

    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            background: #eef2f7;
            min-height: 100vh;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        }

        .navbar {
            box-shadow: 0 0.5rem 1rem rgba(13, 110, 253, 0.15);
        }

        .page-header {
            background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
            color: #fff;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 0.75rem 1.5rem rgba(15, 23, 42, 0.08);
        }

        .page-header h1,
        .page-header p {
            color: #fff;
        }

        .card {
            border: none;
            border-radius: 1rem;
        }

        .card.shadow-sm {
            box-shadow: 0 0.75rem 1.5rem rgba(15, 23, 42, 0.08);
        }

        .student-card,
        .promotion-card {
            min-height: 100%;
        }

        .student-card {
            min-height: 32rem;
        }

        .promotion-card {
            min-height: 32rem;
        }

        .student-card-image {
            height: 220px;
            object-fit: cover;
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
        }

        .student-card-placeholder {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
        }

        .badge-status {
            min-width: 110px;
        }

        .alert {
            border-radius: 1rem;
        }

        .card-body {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(3px);
        }

        .card-footer {
            background: rgba(255, 255, 255, 0.98);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
        .card-background-main {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-size: cover;
    background-position: center;
    filter: blur(2px) brightness(0.7);
    z-index: 0;
}
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">

        <a class="navbar-brand d-flex align-items-center"
           href="{% url 'dashboard' %}">
            <img src="{% static 'img/logo-simple.svg' %}"
                 alt="Institut Logo"
                 height="40"
                 class="me-2">

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link"
                       href="{% url 'dashboard' %}">
                        <i class="bi bi-speedometer2 me-1"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="{% url 'etudiant_list' %}">
                        <i class="bi bi-people me-1"></i>
                        Étudiants
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="{% url 'promotion_list' %}">
                        <i class="bi bi-mortarboard me-1"></i>
                        Promotions
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- CONTENU -->
<main class="container-fluid px-3 px-lg-4 pb-5">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}
                        alert-dismissible fade show"
                 role="alert">

                {{ message }}

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</main>

<script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>

</body>
</html>
